<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline | Expense Tracker</title>
<style>
  /* Self-contained on purpose: when this page is shown there is no network, so it
     cannot rely on the app's stylesheet or scripts. */
  :root { color-scheme: light dark; --bg:#f3f6f5; --card:#fff; --text:#09090b; --muted:#52525b; --line:#e4e4e7; --blue:#0f766e; }
  html.dark { --bg:#000; --card:#09090b; --text:#fafafa; --muted:#a1a1aa; --line:#27272a; --blue:#2dd4bf; }
  @media (prefers-color-scheme: dark) { html:not(.light) { --bg:#000; --card:#09090b; --text:#fafafa; --muted:#a1a1aa; --line:#27272a; --blue:#2dd4bf; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:32px 24px; text-align:center; }
  .mark { width:56px; height:56px; margin:0 auto 16px; border-radius:14px; display:grid; place-items:center;
          background:linear-gradient(135deg,#2dd4bf,#0f766e); }
  h1 { margin:0 0 8px; font-size:22px; letter-spacing:-0.01em; }
  p { margin:0 0 24px; font-size:15px; line-height:1.5; color:var(--muted); }
  button { font:inherit; font-weight:600; font-size:16px; min-height:44px; padding:0 24px; border:0; border-radius:10px; background:var(--blue); color:#fff; cursor:pointer; }
</style>
<script>
  try { var s = localStorage.getItem("theme"); if (s) document.documentElement.className = s === "dark" ? "dark" : "light"; } catch (e) {}
</script>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
  </div>
  <h1>You are offline</h1>
  <p>Expense Tracker needs a connection to show your expenses and budgets. Check your internet and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
